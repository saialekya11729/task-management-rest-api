services:
  api:
    build: .
    command: sh -c "flask --app wsgi.py init-db && flask --app wsgi.py run --host 0.0.0.0 --port 5000"
    environment:
      SECRET_KEY: dev-secret-key-change-this-value-32
      JWT_SECRET_KEY: dev-jwt-secret-key-change-this-32
      DATABASE_URL: postgresql+psycopg://task_user:task_password@db:5432/taskdb
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_user -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
